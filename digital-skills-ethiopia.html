<!DOCTYPE html>
<html lang="en">
<head>

    <title>login</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <div id="div"> 

        <center><h1>login</h1></center>
        <form action="">
            <input type="text" name="user name" id="" placeholder="name" required>
            <input type="email" name="user name" id="" placeholder="email" required>
            <input type="password" minlength="6" name="user name" id="" placeholder="password" required>
            <select>
            <option value="">gender</option>
            <option value="male">male</option>
            <option value="female">female</option>
            </select>
        <button type="submit">login</button>
        </form>
    </div>

</body>
